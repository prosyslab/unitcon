<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
            updateLogo();
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        updateLogo();
    });

    function updateLogo() {
        const isDarkMode = document.body.classList.contains('dark');
        const prosys_logo = document.querySelector('#prosys-logo');
        const zenodo_logo = document.querySelector('#zenodo-logo');

        if (prosys_logo) {
            prosys_logo.src = isDarkMode
                ? 'img/prosys-logo-white.svg'
                : 'img/prosys-logo-black.png';
        }
        if (zenodo_logo) {
            zenodo_logo.src = isDarkMode
                ? 'https://about.zenodo.org/static/img/icons/zenodo-icon-white.svg'
                : 'https://about.zenodo.org/static/img/icons/zenodo-icon-black.svg';
        }
    }
</script>
