<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
            updateLogo();
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        updateLogo();
    });

    function updateLogo() {
        const isDarkMode = document.body.classList.contains('dark');
        const prosys_long_logo = document.querySelector('#prosys-long-logo');
        const kaist_long_logo = document.querySelector('#kaist-long-logo');
        const zenodo_logo = document.querySelector('#zenodo-logo');

        if (zenodo_logo) {
            zenodo_logo.src = isDarkMode
                ? 'https://about.zenodo.org/static/img/icons/zenodo-icon-white.svg'
                : 'https://about.zenodo.org/static/img/icons/zenodo-icon-black.svg';
        }
        if (prosys_long_logo) {
            prosys_long_logo.src = isDarkMode
                ? 'img/prosys-logo-long-white.png'
                : 'img/prosys-logo-long-blue.png';
        }
        if (kaist_long_logo) {
            kaist_long_logo.src = isDarkMode
                ? 'img/kaist-logo-white.png'
                : 'img/kaist-logo-blue.png';
        }
    }
</script>
<a href="#top" aria-label="go to top" title="Go to Top (Alt + G)" class="top-link" id="top-link" accesskey="g">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6" fill="currentColor">
        <path d="M12 6H0l6-6z" />
    </svg>
</a>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
