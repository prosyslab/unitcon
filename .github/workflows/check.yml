name: check

on: [push, pull_request]

jobs:
  infer-build:
    name: infer-build
    runs-on: ubuntu-22.04
    outputs:
      output1: ${{ steps.artifact-infer.outputs.artifact-id }}
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Get submodule commit hash
        id: submodule-hash
        run: |
          HASH=$(git rev-parse --short HEAD:unitcon-infer)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
      
      - name: Install required apt packages
        run: |
          sudo apt install libmpfr-dev libsqlite3-dev
          sudo apt clean

      - name: Set up JAVA
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Cache Infer
        id: cache-infer
        uses: actions/cache@v4
        with:
          path: infer.tar
          key: infer-tar-${{ steps.submodule-hash.outputs.hash }}
          restore-keys: |
            infer-tar-${{ steps.submodule-hash.outputs.hash }}
            infer-tar-

      - name: Set up OCaml
        if: steps.cache-infer.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ocaml-variants.4.14.0+options,ocaml-option-flambda

      - name: Build Infer
        if: steps.cache-infer.outputs.cache-hit != 'true'
        shell: bash
        run: |
          eval $(opam env)
          cd unitcon-infer
          ./build-infer.sh --yes java
          cd ..
          tar -cf infer.tar unitcon-infer

      - name: Upload Infer Artifact
        uses: actions/upload-artifact@v4
        id: artifact-infer
        with:
          name: infer-artifact
          path: infer.tar
          retention-days: 1

  unitcon-build:
    name: unitcon-build
    runs-on: ubuntu-22.04
    needs: infer-build
    permissions:
      statuses: write
      contents: read
    steps:
      - env:
          OUTPUT1: ${{ needs.infer-build.outputs.output1 }}
        run: echo "Infer artifact-id is $OUTPUT1"
    
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }} 

      - name: Set up JAVA
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Use cached dependencies
        id: cache-unitcon-opam
        uses: actions/cache@v4
        env:
          cache-name: cache-unitcon-opam
        with:
          path: |
            ~/.opam
          key: ${{ env.cache-name }}-build-${{ hashFiles('setup.sh') }}
          restore-keys: |
            ${{ env.cache-name }}-build-${{ hashFiles('setup.sh') }}
            ${{ env.cache-name }}-build-

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ocaml-variants.4.14.0+options,ocaml-option-flambda

      - name: Install ocamlformat
        shell: bash
        run: opam install ocamlformat.0.26.1

      - name: Check format
        shell: bash
        run: |
          eval $(opam env)
          make fmt

      - name: Download Infer Artifact
        uses: actions/download-artifact@v4
        with:
          name: infer-artifact
          github-token: ${{ secrets.ACTION_TOKEN }}

      - name: Untar Infer Artifact
        run: tar -xf infer.tar

      - name: Build Unitcon
        shell: bash
        run: |
          ./setup.sh unitcon || { eval $(opam env) && make -j; }

      - name: Run test (regression)
        shell: bash
        run: |
          eval $(opam env) && make coverage
